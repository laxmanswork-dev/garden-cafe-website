<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- Hero-critical fonts: 500 sets the headline (the largest paint),
         300 the navbar wordmark, Inter the navigation and buttons. -->
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-300.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The Garden Cafe badge (master: _source-assets/public/images/brand/garden-cafe-logo-original.png). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Page title, description, canonical, Open Graph, Twitter and theme-color
      are managed per page by src/components/Seo (React Helmet Async).
      Do not duplicate them here.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: Georgia, serif">
        Garden Cafe works best with JavaScript enabled.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
